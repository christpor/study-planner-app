<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Study Planner</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #11181c;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #151718;
                color: #ecedee;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Placeholder for React app
        document.getElementById('root').innerHTML = `
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; padding: 20px; text-align: center;">
                <h1>📚 Study Planner</h1>
                <p style="font-size: 18px; opacity: 0.8;">Loading your app...</p>
                <p style="font-size: 14px; opacity: 0.6; margin-top: 20px;">
                    If this page doesn't load, please refresh or check your internet connection.
                </p>
            </div>
        `;
    </script>
    <script>
        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }
    </script>
</body>
</html>
